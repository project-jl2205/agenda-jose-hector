<script>/* tus colores y la isla quitada, antes del primer pintado (personales: solo en este dispositivo) */
try { var t = JSON.parse(localStorage.getItem('agenda-jh-tema')), ok = function (c) { return /^#[0-9a-f]{6}$/i.test(c || ''); };
  if (t && ok(t.bg) && ok(t.card) && ok(t.barra)) { var s = document.documentElement.style; s.setProperty('--bg', t.bg); s.setProperty('--card', t.card); s.setProperty('--barra', t.barra); }
  if (localStorage.getItem('agenda-jh-isla') === 'quitada') document.documentElement.classList.add('arranca-sin-isla');
} catch (e) { }</script>
